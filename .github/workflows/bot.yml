name: GitHub Auto Commit Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  
jobs:
  update_profile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generuj aktywność
        run: date >> bot_activity.txt

      - name: Odpalenie git-auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated profile update [skip ci]"
          commit_user_name: "GitHub Profile Bot"
          commit_user_email: "actions@github.com"
